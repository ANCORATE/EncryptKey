name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest argon2-cffi cryptography PyQt6

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Create source archive
        run: git archive --format=zip --output=EncryptKey-${{ github.ref_name }}-source.zip HEAD

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create source archive
        run: git archive --format=zip --output=EncryptKey-${{ github.ref_name }}-source.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EncryptKey-${{ github.ref_name }}-source.zip
          generate_release_notes: true