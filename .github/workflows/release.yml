name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EncryptKey-Windows.exe
            sep: ";"
          - os: macos-latest
            artifact: EncryptKey-macOS
            sep: ":"
          - os: ubuntu-latest
            artifact: EncryptKey-Linux
            sep: ":"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 argon2-cffi cryptography requests pytest pyinstaller

      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build executable
        shell: bash
        run: |
          args=(--noconfirm --windowed --onefile --name EncryptKey main.py)
          args+=(--collect-all PyQt6)
          args+=(--add-data "utilities${{ matrix.sep }}utilities")
          args+=(--add-data "app${{ matrix.sep }}app")
          pyinstaller "${args[@]}"

      - name: Prepare artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/EncryptKey.exe "${{ matrix.artifact }}"
          else
            cp dist/EncryptKey "${{ matrix.artifact }}"
          fi

      - name: Prepare installer data (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist dist mkdir dist

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: iscc EncryptKey.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EncryptKey-Setup.exe
          path: dist/setup_output/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create source archive
        run: git archive --format=zip --output=EncryptKey-${{ github.ref_name }}-source.zip HEAD

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            EncryptKey-${{ github.ref_name }}-source.zip
          generate_release_notes: true